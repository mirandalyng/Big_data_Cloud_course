services:
  backend:
    container_name: backend
    build:
      #context - exactly this file (in this case the root map)
      context: .
      dockerfile: dockerfiles/backend.dockerfile
    #host to container
    ports:
      - "8000:8000"

  frontend:
    container_name: frontend
    build:
      #context - exactly this file (in this case the root map)
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    #host to container
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
