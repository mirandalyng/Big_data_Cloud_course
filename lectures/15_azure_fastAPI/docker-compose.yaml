services:
  backend:
    container_name: backend
    platform: linux/amd64
    build:
      #context - exactly this file (in this case the root map)
      context: .
      dockerfile: dockerfiles/backend.dockerfile
    #host to container
    ports:
      - "8000:8000"
    image: azrfirst-fqeaeedpcreqcah8.azurecr.io/backend:v1

  frontend:
    container_name: frontend
    platform: linux/amd64
    build:
      #context - exactly this file (in this case the root map)
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    #host to container
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    image: azrfirst-fqeaeedpcreqcah8.azurecr.io/frontend:v1
